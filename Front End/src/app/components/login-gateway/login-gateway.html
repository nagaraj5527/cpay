<div class="text-center mb-4">
  <!-- Centered Logo at the top -->
  <div class="mb-3">
    <div class="bg-white rounded-3 p-2 d-inline-block shadow-sm">
      <img src="/logo.jpg" alt="C-PAY Logo" class="img-fluid" style="height: 64px; width: auto; display: block;">
    </div>
  </div>
  <!-- APCCB Title below the logo -->
  <h1 class="h2 fw-bold mb-1" style="letter-spacing: -0.5px; font-size: 32px; color: var(--primary-teal);">C-<span style="color: #000000;">PAY</span></h1>
  <!-- Subtitle below the title -->
  <p class="small fw-semibold text-muted mb-4 text-center">Carbon Credit Bank</p>
  
  <hr class="my-4 opacity-10">
  <h5 class="fw-normal mb-4" style="color: #4a5c58; font-size: 18px;">Select user type to continue</h5>
</div>

<div class="row g-3 justify-content-center mb-5">
  <!-- Seller/Buyer Card -->
  <div class="col-md-4 col-sm-6">
    <a routerLink="/login/seller-buyer" class="user-type-card h-100">
      <div class="user-type-icon-wrapper">
        <i class="bi bi-person-fill"></i>
      </div>
      <h6 class="fw-bold mb-2" style="font-size: 16px;">Seller/Buyer</h6>
      <p class="text-muted mb-0" style="font-size: 11px; line-height: 1.4;">
        Farmer / Land Owner / FPO<br>NGO / Citizen / Buyer
      </p>
    </a>
  </div>

  <!-- Valuator Card -->
  <div class="col-md-4 col-sm-6">
    <a routerLink="/login/valuator" class="user-type-card h-100">
      <div class="user-type-icon-wrapper" style="background-color: transparent !important;">
        <img src="/valuator_icon.png" alt="Valuator Icon" style="width: 100%; height: 100%; object-fit: contain; border-radius: 50%;">
      </div>
      <h6 class="fw-bold mb-2" style="font-size: 16px;">Valuator</h6>
      <p class="text-muted mb-0" style="font-size: 11px; line-height: 1.4;">
        Valuator / Auditor
      </p>
    </a>
  </div>

  <!-- Administrator Card -->
  <div class="col-md-4 col-sm-6">
    <a routerLink="/login/admin" class="user-type-card h-100">
      <div class="user-type-icon-wrapper">
        <i class="bi bi-shield-lock-fill"></i>
      </div>
      <h6 class="fw-bold mb-2" style="font-size: 16px;">Administrator</h6>
      <p class="text-muted mb-0" style="font-size: 11px; line-height: 1.4;">
        State Admin / Super Admin
      </p>
    </a>
  </div>
</div>

</div>
